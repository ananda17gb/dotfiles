stacking-order=top-down
anchor=top-right
edge-margin-vertical=0
edge-margin-horizontal=5
notification-margin=10
icon-theme=hicolor
max-icon-size=32
selection-helper=fuzzel --dmenu
border-radius=1
border-size=1
padding-vertical=12
padding-horizontal=15
title-font=monospace:size=10:style=bold
title-format=
summary-font=monospace:size=9:style=bold
summary-color=bbbbbbff
summary-format=<b>%s</b>
body-font=monospace:size=9
body-color=bbbbbbff
body-format=%b
progress-bar-height=4
progress-color=bbbbbbff

[low]
background=000000ff
border-color=bbbbbbff
default-timeout=5

[normal]
background=000000ff
border-color=bbbbbbff
default-timeout=10

[critical]
background=000000ff
border-color=de6e7cff
default-timeout=0
