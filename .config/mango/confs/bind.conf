# toggle themes
# bind = super+alt+shift,t,spawn_shell, ~/.config/mango/scripts/theme-switcher.sh 

# toggle inhibit
bind = alt,i,spawn_shell, ~/.config/mango/scripts/inihibit.sh 

# tag info
# bind = alt,t,spawn_shell, ~/.config/mango/scripts/tag-notifier.sh

# warp bind
bind=alt,d,spawn_shell, ~/.config/mango/scripts/toggle-warp_cli.sh
bind=alt+shift,d,spawn_shell, notify-send "warp-cli" "$(warp-cli status)"

# bluetui bind
bind=super+shift,b,spawn,foot -e bluetui

# impala bind
bind=super+shift,w,spawn,foot -e impala

# wiremix bind
bind=super+shift,p,spawn,foot -e impala

# refresh rate bind
bind=SUPER+CTRL,F5,spawn_shell,wlr-randr --output eDP-1 --mode 1920x1080@60.019001Hz && notify-send "Refresh Rate" "Set to 60" -t 2000
bind=SUPER+CTRL,F6,spawn_shell,wlr-randr --output eDP-1 --mode 1920x1080@144.003006Hz && notify-send "Refresh Rate" "Set to 144" -t 2000

# toggle gammastep
# bind=SUPER+SHIFT,g,spawn_shell,~/.config/mango/scripts/toggle-gammastep.sh >/dev/null 2>&1 &

bind = SUPER, F1, spawn_shell, bash -c 'pkill gammastep; gammastep -b 0.5 -O 6500 & notify-send "Dim" "50% | On" -t 1000'
bind = SUPER, F2, spawn_shell, bash -c 'pkill gammastep; gammastep -b 0.7 -O 6500 & notify-send "Dim" "70% | On" -t 1000'
bind = SUPER, F3, spawn_shell, bash -c 'pkill gammastep; notify-send "Dim" "Off" -t 1000'

# screenshot bindings
# bind=SUPER,s,spawn_shell, $HOME/.config/mango/scripts/screenshot/screenshot-menu.sh
bind=SUPER,F8,spawn_shell, $HOME/.config/mango/scripts/screenshot/screenshot.sh fullscreen false false 
bind=SUPER,F9,spawn_shell, $HOME/.config/mango/scripts/screenshot/screenshot.sh region false false
bind=SUPER,F10,spawn_shell, $HOME/.config/mango/scripts/screenshot/screenshot.sh window false false
bind=SUPER+SHIFT,F8,spawn_shell, $HOME/.config/mango/scripts/screenshot/screenshot.sh fullscreen false true
bind=SUPER+SHIFT,F9,spawn_shell, $HOME/.config/mango/scripts/screenshot/screenshot.sh region false true
bind=SUPER+SHIFT,F10,spawn_shell, $HOME/.config/mango/scripts/screenshot/screenshot.sh window flase true

# brightness bindings
binds=NONE,XF86MonBrightnessUp,spawn_shell, ~/.config/mango/scripts/brightness-notifier.sh up
binds=NONE,XF86MonBrightnessDown,spawn_shell,~/.config/mango/scripts/brightness-notifier.sh down

# volume binding
binds=NONE,XF86AudioRaiseVolume,spawn,~/.config/mango/scripts/volume-notifier.sh up
binds=NONE,XF86AudioLowerVolume,spawn,~/.config/mango/scripts/volume-notifier.sh down
binds=NONE,XF86AudioMute,spawn,~/.config/mango/scripts/volume-notifier.sh mute

# tws binding
binds=NONE,XF86AudioNext,spawn,playerctl next
binds=NONE,XF86AudioPrev,spawn,playerctl previous
binds=NONE,XF86AudioPlay,spawn,playerctl play-pause

# clipboard manager
binds=SUPER,v,spawn_shell,cliphist list | fuzzel --dmenu --lines 5 | cliphist decode | wl-copy

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,R,reload_config

# menu and terminals
bind=SUPER,d,spawn_shell,fuzzel --lines 5
bind=SUPER,Return,spawn,kitty
bind=SUPER,Backslash,spawn,foot

# exit
bind=SUPER+SHIFT,e,spawn,~/.config/mango/scripts/power-menu.sh
bind=SUPER+SHIFT,q,killclient

# yambar toggle
# bind=SUPER,y,spawn_shell,~/.config/mango/scripts/toggle-yambar.sh

# switch window focus
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,toggleoverview,
# bind=SUPER+alt,j,togglejump,
bind=Alt,v,togglefloating,
bind=SUPER+SHIFT,f,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+alt,f,togglefakefullscreen,
bind=SUPER,minus,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,minus,restore_minimized
bind=SUPER,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=ALT,r,spawn_shell,mmsg dispatch set_proportion,1.0 && mmsg dispatch set_proportion,0.5
bind=SUPER+SHIFT+ALT,k,scroller_stack,up
bind=SUPER+SHIFT+ALT,j,scroller_stack,down
bind=SUPER+SHIFT+ALT,h,scroller_stack,left
bind=SUPER+SHIFT+ALT,l,scroller_stack,right

# switch layout
bind=SUPER+ALT,1,setlayout,scroller
bind=SUPER+ALT,2,setlayout,monocle
bind=SUPER+ALT,3,setlayout,dwindle
bind=SUPER+ALT,4,setlayout,center_tile
bind=SUPER+ALT,5,setlayout,vertical_grid
bind=SUPER+ALT,6,setlayout,fair

# Dwindle layout
dwindle_split_ratio = 0.5
dwindle_smart_split = 0
dwindle_hsplit = 1
dwindle_vsplit = 1
dwindle_preserve_split = 0
dwindle_smart_resize = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 1

# tag switch to the ones that has window
bind=SUPER,bracketleft,viewtoleft_have_client,0
bind=SUPER,bracketright,viewtoright_have_client,0

# win move to tags that has window
bind=SUPER+SHIFT,bracketleft,tagtoleft,0
bind=SUPER+SHIFT,bracketright,tagtoright,0

# tag switch
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# move client to the tag and focus it
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=SUPER+Alt,h,focusmon,left
bind=SUPER+Alt,l,focusmon,right
bind=SUPER+Alt+CTRL+Shift,h,tagmon,left
bind=SUPER+Alt+CTRL+Shift,l,tagmon,right

# resizewin
bind=CTRL+SUPER,k,resizewin,+0,-50
bind=CTRL+SUPER,j,resizewin,+0,+50
bind=CTRL+SUPER,h,resizewin,-50,+0
bind=CTRL+SUPER,l,resizewin,+50,+0

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

