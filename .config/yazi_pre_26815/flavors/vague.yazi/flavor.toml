#:schema https://yazi-rs.github.io/schemas/theme.json
# vim:fileencoding=utf-8:foldmethod=marker
# : App {{{
[app]
overall = {}
# : }}}
# : Manager {{{
[mgr]
cwd = { fg = "#b4d4cf" }
# Find
find_keyword = { fg = "#f3be7c", bold = true, italic = true, underline = true }
find_position = { fg = "#aeaed1", bg = "reset", bold = true, italic = true }
# Symlink
symlink_target = { italic = true }
# Marker
marker_copied = { fg = "#7fa563", bg = "#7fa563" }
marker_cut = { fg = "#d8647e", bg = "#d8647e" }
marker_marked = { fg = "#b4d4cf", bg = "#b4d4cf" }
marker_selected = { fg = "#f3be7c", bg = "#f3be7c" }
marker_symbol = "│"
# Count
count_copied = { fg = "#141415", bg = "#7fa563" }
count_cut = { fg = "#141415", bg = "#d8647e" }
count_selected = { fg = "#141415", bg = "#f3be7c" }
# Border
border_symbol = "│"
border_style = { fg = "#878787" }
# Highlighting
syntect_theme = ""
# : }}}
# : Tabs {{{
[tabs]
active = { fg = "#141415", bg = "#7e98e8", bold = true }
inactive = { fg = "#7e98e8", bg = "#252530" }
# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }
# : }}}
# : Mode {{{
[mode]
normal_main = { fg = "#141415", bg = "#aeaed1", bold = true }
normal_alt = { fg = "#7e98e8", bg = "#252530" }
# Select mode
select_main = { fg = "#141415", bg = "#b4d4cf", bold = true }
select_alt = { fg = "#b4d4cf", bg = "#252530" }
# Unset mode
unset_main = { fg = "#141415", bg = "#c48282", bold = true }
unset_alt = { fg = "#c48282", bg = "#252530" }
# : }}}
# : Indicator of hovered file {{{
[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }
# : }}}
# : Status bar {{{
[status]
overall = {}
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
# Permissions
perm_sep = { fg = "#878787" }
perm_type = { fg = "#7e98e8" }
perm_read = { fg = "#f3be7c" }
perm_write = { fg = "#d8647e" }
perm_exec = { fg = "#7fa563" }
# Progress
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#7fa563", bg = "#1c1c24" }
progress_error = { fg = "#f3be7c", bg = "#d8647e" }
# : }}}
# : Which {{{
[which]
cols = 3
mask = { bg = "#252530" }
cand = { fg = "#b4d4cf" }
rest = { fg = "#90a0b5" }
desc = { fg = "#aeaed1" }
separator = "  "
separator_style = { fg = "#606079" }
# : }}}
# : Confirmation {{{
[confirm]
border = { fg = "#7e98e8" }
title = { fg = "#7e98e8" }
body = {}
list = {}
btn_yes = { reversed = true }
btn_no = {}
btn_labels = ["  [Y]es  ", "  (N)o  "]
# : }}}
# : Spotter {{{
[spot]
border = { fg = "#7e98e8" }
title = { fg = "#7e98e8" }
# Table
tbl_col = { fg = "#b4d4cf" }
tbl_cell = { fg = "#aeaed1", bg = "#1c1c24" }
# : }}}
# : Notification {{{
[notify]
title_info = { fg = "#7fa563" }
title_warn = { fg = "#f3be7c" }
title_error = { fg = "#d8647e" }
# Icons
icon_info = ""
icon_warn = ""
icon_error = ""
# : }}}
# : Picker {{{
[pick]
border = { fg = "#7e98e8" }
active = { fg = "#aeaed1", bold = true }
inactive = {}
# : }}}
# : Input {{{
[input]
border = { fg = "#aeaed1" }
title = {}
value = {}
selected = { reversed = true }
# : }}}
# : Completion {{{
[cmp]
border = { fg = "#7e98e8" }
active = { reversed = true }
inactive = {}
# Icons
icon_file = ""
icon_folder = ""
icon_command = ""
# : }}}
# : Task manager {{{
[tasks]
border = { fg = "#7e98e8" }
title = {}
hovered = { fg = "#aeaed1", bold = true }
# : }}}
# : Help menu {{{
[help]
on = { fg = "#b4d4cf" }
run = { fg = "#aeaed1" }
desc = {}
hovered = { reversed = true, bold = true }
footer = { fg = "#252530", bg = "#cdcdcd" }
# : }}}
# : File-specific styles {{{
[filetype]
rules = [
  # Image
  { mime = "image/*", fg = "#b4d4cf" },
  # Media
  { mime = "{audio,video}/*", fg = "#f3be7c" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#aeaed1" },
  # Document
  { mime = "application/{pdf,doc,rtf}", fg = "#7fa563" },
  # Virtual file system
  { mime = "vfs/{absent,stale}", fg = "#90a0b5" },
  # Special file
  { url = "*", is = "orphan", bg = "#d8647e" },
  { url = "*", is = "exec", fg = "#7fa563" },
  # Dummy file
  { url = "*", is = "dummy", bg = "#d8647e" },
  { url = "*/", is = "dummy", bg = "#d8647e" },
  # Fallback
  { url = "*", fg = "#cdcdcd" },
  { url = "*/", fg = "#6e94b2" },
]
# : }}}
# : Icons {{{
[icon]
dirs = [
  { name = ".config", text = "", fg = "#aeaed1" },
  { name = ".git", text = "", fg = "#b4d4cf" },
  { name = ".github", text = "", fg = "#7e98e8" },
  { name = ".npm", text = "", fg = "#7e98e8" },
  { name = "Desktop", text = "", fg = "#6e94b2" },
  { name = "Development", text = "", fg = "#6e94b2" },
  { name = "Documents", text = "", fg = "#6e94b2" },
  { name = "Downloads", text = "", fg = "#6e94b2" },
  { name = "Library", text = "", fg = "#6e94b2" },
  { name = "Movies", text = "", fg = "#6e94b2" },
  { name = "Music", text = "", fg = "#6e94b2" },
  { name = "Pictures", text = "", fg = "#6e94b2" },
  { name = "Public", text = "", fg = "#6e94b2" },
  { name = "Videos", text = "", fg = "#6e94b2" },
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#cdcdcd" },
  { if = "link", text = "", fg = "#878787" },
  { if = "block", text = "", fg = "#c48282" },
  { if = "char", text = "", fg = "#c48282" },
  { if = "fifo", text = "", fg = "#c48282" },
  { if = "sock", text = "", fg = "#c48282" },
  { if = "sticky", text = "", fg = "#c48282" },
  { if = "dummy", text = "", fg = "#d8647e" },
  # Fallback
  { if = "dir  & hovered", text = "", fg = "#9bb4bc" },
  { if = "dir", text = "", fg = "#9bb4bc" },
  { if = "exec", text = "", fg = "#7fa563" },
  { if = "!dir", text = "", fg = "#cdcdcd" },
]
# : }}}
